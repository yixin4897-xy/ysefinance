name: AEHI official ABS E01 live candidate (manual review)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e01-source-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline source importer tests
        run: python -m unittest discover -s tests -p "test_aehi_abs_api_import.py" -v
      - name: Fetch exact ABS GDP per capita quarterly series and compute review-only QoQ values
        run: python scripts/aehi_abs_api_import.py --config docs/aehi-pinned-series.json --code E01 --output data-candidates/aehi-e01-api-review.json
      - name: Upload unapproved candidate series for analyst cross-check
        uses: actions/upload-artifact@v4
        with:
          name: aehi-e01-abs-api-candidate-for-review
          path: data-candidates/aehi-e01-api-review.json
          retention-days: 30
